[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chotuai"
version = "0.1.0"
description = "A local AI developer assistant powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "rich"
]

[project.scripts]
chotuai = "chotuai.main:main"